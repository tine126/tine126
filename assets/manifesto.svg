<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Anonymous manifesto</title>
  <desc id="desc">A concise statement about identity, authority, and signal.</desc>
  <defs>
    <linearGradient id="fade" x1="0" x2="1"><stop stop-color="#d00000"/><stop offset=".55" stop-color="#d00000" stop-opacity=".28"/><stop offset="1" stop-color="#d00000" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="230" rx="14" fill="#070707"/>
  <rect x="1" y="1" width="1198" height="228" rx="13" fill="none" stroke="#303030"/>
  <rect x="0" width="7" height="230" rx="3" fill="#d00000"/>
  <g font-family="Consolas,monospace">
    <text x="43" y="43" fill="#d00000" font-size="10" letter-spacing="5">MANIFESTO // DECLASSIFIED</text>
    <text x="43" y="102" fill="#f0f0f0" font-size="23" letter-spacing="4">NO FACE. NO AUTHORITY. NO IMPOSED IDENTITY.</text>
    <text x="43" y="144" fill="#8b8b8b" font-size="18" letter-spacing="5">ONLY THE SIGNAL REMAINS.</text>
    <text x="43" y="202" fill="#4d4d4d" font-size="9" letter-spacing="3">PRIVACY IS NOT INVISIBILITY // ORIGINALITY REQUIRES DISTANCE</text>
  </g>
  <path d="M43 174h1080" stroke="url(#fade)"/>
  <g transform="translate(1055 63)" fill="none" stroke="#292929">
    <circle r="48"/><circle r="32" stroke-dasharray="2 7"/><path d="M-62 0h124M0-62v124"/>
  </g>
  <circle cx="1055" cy="63" r="4" fill="#d00000"/>
</svg>
