<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Anonymous principles</title><desc id="desc">Five monochrome statements formatted as a redacted intelligence document.</desc>
  <rect width="1200" height="360" rx="16" fill="#050505"/><rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#303030"/>
  <text x="46" y="38" fill="#d00000" font-family="Consolas,monospace" font-size="10" letter-spacing="5">DECLASSIFIED FRAGMENT // 05 PRINCIPLES</text>
  <path d="M46 56h1108" stroke="#303030"/>
  <g font-family="Consolas,monospace">
    <g fill="#d00000" font-size="13" letter-spacing="3"><text x="56" y="98">01</text><text x="56" y="148">02</text><text x="56" y="198">03</text><text x="56" y="248">04</text><text x="56" y="298">05</text></g>
    <g fill="#e8e8e8" font-size="16" letter-spacing="2"><text x="128" y="98">A NAME IS ONLY AN IDENTIFIER.</text><text x="128" y="148">IDENTITY IS LARGER THAN APPEARANCE.</text><text x="128" y="198">PRIVACY IS NOT INVISIBILITY.</text><text x="128" y="248">ORIGINALITY REQUIRES DISTANCE FROM THE CROWD.</text><text x="128" y="298">EVERY SIGNAL LEAVES A TRACE.</text></g>
  </g>
  <g stroke="#242424"><path d="M46 116h1108M46 166h1108M46 216h1108M46 266h1108M46 316h1108"/></g>
  <g fill="#161616"><rect x="842" y="84" width="266" height="18"/><rect x="744" y="134" width="364" height="18"/><rect x="820" y="284" width="288" height="18"/></g>
  <text x="1148" y="342" fill="#555" font-family="Consolas,monospace" font-size="8" letter-spacing="3" text-anchor="end">END OF RECOVERED FRAGMENT</text>
</svg>
