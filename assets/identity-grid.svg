<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="176" viewBox="0 0 1200 176" role="img" aria-labelledby="title desc">
  <title id="title">Anonymous identity status</title>
  <desc id="desc">Three compact intelligence cards showing identity, origin, and status.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#151515"/></pattern>
  </defs>
  <rect width="1200" height="176" rx="14" fill="#050505"/>
  <rect x="1" y="1" width="1198" height="174" rx="13" fill="none" stroke="#292929"/>
  <rect width="1200" height="176" rx="14" fill="url(#grid)" opacity=".55"/>
  <g font-family="Consolas,monospace">
    <g transform="translate(24 22)">
      <rect width="368" height="132" rx="8" fill="#080808" stroke="#303030"/>
      <rect width="4" height="132" rx="2" fill="#d00000"/>
      <text x="24" y="29" fill="#666" font-size="10" letter-spacing="3">01 // IDENTITY</text>
      <text x="24" y="72" fill="#eeeeee" font-size="21" letter-spacing="6">REDACTED</text>
      <rect x="24" y="94" width="136" height="5" fill="#d00000"/><rect x="166" y="94" width="58" height="5" fill="#3a3a3a"/>
      <text x="24" y="119" fill="#555" font-size="8" letter-spacing="2">NO FACE // NO ASSIGNED NAME</text>
    </g>
    <g transform="translate(416 22)">
      <rect width="368" height="132" rx="8" fill="#080808" stroke="#303030"/>
      <text x="24" y="29" fill="#666" font-size="10" letter-spacing="3">02 // ORIGIN</text>
      <text x="24" y="72" fill="#eeeeee" font-size="21" letter-spacing="5">CN / UTC+08</text>
      <path d="M24 96h264" stroke="#353535"/><circle cx="301" cy="96" r="5" fill="#d00000"/>
      <text x="24" y="119" fill="#555" font-size="8" letter-spacing="2">LOCATION IS NOT IDENTITY</text>
    </g>
    <g transform="translate(808 22)">
      <rect width="368" height="132" rx="8" fill="#080808" stroke="#303030"/>
      <text x="24" y="29" fill="#666" font-size="10" letter-spacing="3">03 // STATUS</text>
      <circle cx="31" cy="65" r="6" fill="#d00000"/>
      <circle cx="31" cy="65" r="13" fill="none" stroke="#d00000" opacity=".25"/>
      <text x="56" y="72" fill="#eeeeee" font-size="21" letter-spacing="6">OBSERVING</text>
      <text x="24" y="119" fill="#555" font-size="8" letter-spacing="2">PRESENCE CONFIRMED // INTENT UNKNOWN</text>
    </g>
  </g>
</svg>
