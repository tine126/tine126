<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="306" viewBox="0 0 1200 306" role="img" aria-labelledby="title desc">
  <title id="title">Intercepted terminal</title><desc id="desc">An animated terminal attempting and failing to resolve the identity tine126.</desc>
  <rect width="1200" height="306" rx="16" fill="#050505"/><rect x="1" y="1" width="1198" height="304" rx="15" fill="none" stroke="#303030"/>
  <path d="M0 42h1200" stroke="#303030"/><circle cx="24" cy="21" r="5" fill="#d00000"/><circle cx="43" cy="21" r="5" fill="#303030"/><circle cx="62" cy="21" r="5" fill="#303030"/>
  <text x="600" y="25" fill="#777" font-family="Consolas,monospace" font-size="10" letter-spacing="4" text-anchor="middle">INTERCEPTED TERMINAL // SESSION 0126</text>
  <g font-family="Consolas,monospace" font-size="15">
    <text x="42" y="78" fill="#a7a7a7">unknown@blacksite:~$ <tspan fill="#e8e8e8">trace --subject tine126</tspan></text>
    <g><text x="42" y="115" fill="#777">[01/04] searching public records ............ <tspan fill="#e8e8e8">done</tspan></text></g>
    <g opacity="0"><text x="42" y="148" fill="#777">[02/04] resolving identity .................. <tspan fill="#d00000">failed</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.15;.24;1" dur="8s" repeatCount="indefinite"/></g>
    <g opacity="0"><text x="42" y="181" fill="#777">[03/04] locating origin ..................... <tspan fill="#d00000">redacted</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.31;.4;1" dur="8s" repeatCount="indefinite"/></g>
    <g opacity="0"><text x="42" y="214" fill="#777">[04/04] detecting signal .................... <tspan fill="#00c853">active</tspan></text><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.47;.56;1" dur="8s" repeatCount="indefinite"/></g>
    <g opacity="0"><text x="42" y="263" fill="#d00000" font-size="19" letter-spacing="5">ACCESS DENIED</text><text x="1128" y="263" fill="#e8e8e8" font-size="11" letter-spacing="3" text-anchor="end">TRACE REJECTED //</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.63;.72;.94;1" dur="8s" repeatCount="indefinite"/></g>
  </g>
  <rect x="42" y="281" width="9" height="2" fill="#e8e8e8"><animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite"/></rect>
</svg>
