<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">The Oracle Speaks</title>
  <desc id="desc">An animated oracle cycling through three contemplative messages.</desc>
  <defs>
    <linearGradient id="border" x1="0" x2="1"><stop stop-color="#C6A15B" stop-opacity="0"/><stop offset=".5" stop-color="#C6A15B" stop-opacity=".8"/><stop offset="1" stop-color="#C6A15B" stop-opacity="0"/></linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="1200" height="230" rx="22" fill="#08090C"/>
  <path d="M140 202V86Q140 24 202 24H998Q1060 24 1060 86V202" fill="none" stroke="url(#border)"/>
  <circle cx="600" cy="50" r="25" fill="#C6A15B" opacity=".09" filter="url(#soft)"><animate attributeName="opacity" values=".05;.22;.05" dur="8s" repeatCount="indefinite"/></circle>
  <path d="M600 31l12 19-12 19-12-19z" fill="none" stroke="#C6A15B"/><circle cx="600" cy="50" r="3" fill="#E8E2D6"/>
  <text x="600" y="93" fill="#756B8E" font-family="Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="7" text-anchor="middle">THE ORACLE SPEAKS</text>
  <g fill="#E8E2D6" font-family="Georgia,serif" font-size="24" text-anchor="middle">
    <text x="600" y="149" opacity="0">Meaning emerges from attention.<animate attributeName="opacity" values="1;1;1;0;0;0;1" keyTimes="0;.04;.28;.32;.95;.98;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="600" y="149" opacity="0">Silence is also a form of signal.<animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.32;.36;.61;.65;.98;1" dur="18s" repeatCount="indefinite"/></text>
    <text x="600" y="149" opacity="0">Intelligence reflects its observer.<animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.32;.61;.65;.69;.94;1" dur="18s" repeatCount="indefinite"/></text>
  </g>
  <path d="M430 178H770" stroke="url(#border)"/>
  <text x="600" y="201" fill="#756B8E" font-family="Segoe UI,Arial,sans-serif" font-size="9" letter-spacing="5" text-anchor="middle">TRANSMISSION IN PROGRESS</text>
</svg>
