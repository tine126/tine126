    <text x="112" y="39">CHANNEL 0126</text><text x="112" y="58" fill="#e8e8e8">INTERCEPTED</text>
    <text x="1088" y="39" text-anchor="end">TRACE STATUS</text><text x="1088" y="58" text-anchor="end" fill="#d00000">REJECTED</text>
  </g>
</svg>
