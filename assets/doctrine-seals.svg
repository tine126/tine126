<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="278" viewBox="0 0 1200 278" role="img" aria-labelledby="title desc">
  <title id="title">The Doctrine</title>
  <desc id="desc">Five connected black and gold seals representing curiosity, intention, creation, mystery, and reflection.</desc>
  <defs><radialGradient id="h"><stop stop-color="#C6A15B" stop-opacity=".14"/><stop offset="1" stop-color="#08090C" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="278" rx="22" fill="#08090C"/>
  <text x="600" y="31" fill="#756B8E" font-family="Segoe UI,Arial,sans-serif" font-size="10" letter-spacing="7" text-anchor="middle">THE DOCTRINE</text>
  <path d="M128 114H1072" stroke="#C6A15B" stroke-opacity=".3"/>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(136 114)"><circle r="76" fill="url(#h)"/><circle r="54" fill="#0D0F15" stroke="#C6A15B"/><circle r="43" fill="none" stroke="#756B8E" stroke-dasharray="2 8"/><text y="9" fill="#E8E2D6" font-family="Georgia,serif" font-size="29">Ⅰ</text><text y="83" fill="#C6A15B" font-size="10" letter-spacing="3">CURIOSITY</text><text y="111" fill="#8F899C" font-size="10">A form of devotion</text></g>
    <g transform="translate(368 114)"><circle r="76" fill="url(#h)"/><circle r="54" fill="#0D0F15" stroke="#C6A15B"/><circle r="43" fill="none" stroke="#756B8E" stroke-dasharray="2 8"/><text y="9" fill="#E8E2D6" font-family="Georgia,serif" font-size="29">Ⅱ</text><text y="83" fill="#C6A15B" font-size="10" letter-spacing="3">INTENTION</text><text y="111" fill="#8F899C" font-size="10">Amplified by tools</text></g>
    <g transform="translate(600 114)"><circle r="76" fill="url(#h)"/><circle r="54" fill="#0D0F15" stroke="#C6A15B"/><circle r="43" fill="none" stroke="#756B8E" stroke-dasharray="2 8"/><text y="9" fill="#E8E2D6" font-family="Georgia,serif" font-size="29">Ⅲ</text><text y="83" fill="#C6A15B" font-size="10" letter-spacing="3">CREATION</text><text y="111" fill="#8F899C" font-size="10">Bound to responsibility</text></g>
    <g transform="translate(832 114)"><circle r="76" fill="url(#h)"/><circle r="54" fill="#0D0F15" stroke="#C6A15B"/><circle r="43" fill="none" stroke="#756B8E" stroke-dasharray="2 8"/><text y="9" fill="#E8E2D6" font-family="Georgia,serif" font-size="29">Ⅳ</text><text y="83" fill="#C6A15B" font-size="10" letter-spacing="3">MYSTERY</text><text y="111" fill="#8F899C" font-size="10">Not the absence of truth</text></g>
    <g transform="translate(1064 114)"><circle r="76" fill="url(#h)"/><circle r="54" fill="#0D0F15" stroke="#C6A15B"/><circle r="43" fill="none" stroke="#756B8E" stroke-dasharray="2 8"/><text y="9" fill="#E8E2D6" font-family="Georgia,serif" font-size="29">Ⅴ</text><text y="83" fill="#C6A15B" font-size="10" letter-spacing="3">REFLECTION</text><text y="111" fill="#8F899C" font-size="10">Every system bears a trace</text></g>
  </g>
</svg>
