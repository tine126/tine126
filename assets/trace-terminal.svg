<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="156" viewBox="0 0 1200 156" role="img" aria-labelledby="title desc">
  <title id="title">Identity trace terminal</title>
  <desc id="desc">A minimal terminal reports that tine126 remains redacted and online.</desc>
  <rect width="1200" height="156" rx="14" fill="#030303"/>
  <rect x="1" y="1" width="1198" height="154" rx="13" fill="none" stroke="#303030"/>
  <path d="M0 38h1200" stroke="#292929"/>
  <circle cx="23" cy="19" r="5" fill="#d00000"/><circle cx="42" cy="19" r="5" fill="#3d3d3d"/><circle cx="61" cy="19" r="5" fill="#3d3d3d"/>
  <text x="600" y="23" fill="#565656" font-family="Consolas,monospace" font-size="9" letter-spacing="4" text-anchor="middle">INTERCEPTED TERMINAL // SESSION 0126</text>
  <g font-family="Consolas,monospace" font-size="14">
    <text x="35" y="73" fill="#686868">unknown@blacksite:~$ <tspan fill="#e8e8e8">identify tine126</tspan></text>
    <text x="35" y="105" fill="#686868">&gt; identity: <tspan fill="#d00000" letter-spacing="3">REDACTED</tspan></text>
    <text x="35" y="132" fill="#686868">&gt; signal: <tspan fill="#e8e8e8" letter-spacing="3">ONLINE</tspan><tspan fill="#d00000"> █</tspan></text>
  </g>
  <text x="1160" y="132" fill="#404040" font-family="Consolas,monospace" font-size="9" letter-spacing="3" text-anchor="end">TRACE FAILED // 00:00:00</text>
</svg>
