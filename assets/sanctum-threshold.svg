<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="title desc">
  <title id="title">Signal detected</title>
  <desc id="desc">An animated antique-gold signal crossing a dark digital sanctuary.</desc>
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0"/>
      <stop offset=".5" stop-color="#C6A15B"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop stop-color="#E8E2D6"/>
      <stop offset=".35" stop-color="#C6A15B" stop-opacity=".8"/>
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect width="1200" height="112" rx="18" fill="#08090C"/>
  <path d="M80 44H510M690 44H1120" stroke="#C6A15B" stroke-opacity=".28"/>
  <path d="M184 37l7 7-7 7-7-7zM1016 37l7 7-7 7-7-7z" fill="none" stroke="#756B8E"/>
  <circle cx="600" cy="44" r="30" fill="url(#pulse)" filter="url(#glow)" opacity=".35">
    <animate attributeName="r" values="22;36;22" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".18;.5;.18" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="44" r="17" fill="none" stroke="#C6A15B" stroke-opacity=".55"/>
  <circle cx="600" cy="44" r="4" fill="#E8E2D6">
    <animate attributeName="opacity" values=".45;1;.45" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="88" fill="#C6A15B" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="6" text-anchor="middle">SIGNAL DETECTED</text>
</svg>
