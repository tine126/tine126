name: Chronicle of Presence

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chronicle:
    runs-on: ubuntu-latest
    steps:
      - name: Render the contribution chronicle
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: tine126
          filename: github-metrics.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_display: large
          config_timezone: Asia/Shanghai
          config_animations: yes
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #151722;
              --color-calendar-graph-day-border: #24212a;
              --color-calendar-graph-day-L1-bg: #453b2c;
              --color-calendar-graph-day-L2-bg: #846a3d;
              --color-calendar-graph-day-L3-bg: #c6a15b;
              --color-calendar-graph-day-L4-bg: #e8e2d6;
            }
            svg { background: #08090c !important; }
            .items-wrapper { position: relative; min-height: 360px; }
            .items-wrapper::before {
              content: "◇";
              position: absolute;
              right: 158px;
              top: 82px;
              width: 118px;
              height: 118px;
              border: 1px solid #c6a15b;
              border-radius: 50%;
              color: #e8e2d6;
              font-family: Georgia, serif;
              font-size: 34px;
              line-height: 118px;
              text-align: center;
              box-shadow: 0 0 36px rgba(198, 161, 91, .14), inset 0 0 24px rgba(198, 161, 91, .08);
            }
            .items-wrapper::after {
              content: "THE CHRONICLE REMEMBERS";
              position: absolute;
              right: 73px;
              top: 232px;
              width: 290px;
              color: #c6a15b;
              font-size: 11px;
              letter-spacing: 4px;
              text-align: center;
            }
            h2, h3, .field { color: #e8e2d6 !important; }
            h2 { display: none !important; }
            .field svg { fill: #c6a15b !important; }
            path[fill="#ebedf0"] { fill: #151722 !important; }
            path[fill="#9be9a8"] { fill: #453b2c !important; }
            path[fill="#40c463"] { fill: #846a3d !important; }
            path[fill="#30a14e"] { fill: #c6a15b !important; }
            path[fill="#216e39"] { fill: #e8e2d6 !important; }
