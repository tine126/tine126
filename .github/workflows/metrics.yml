name: Signal Activity

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chronicle:
    runs-on: ubuntu-latest
    steps:
      - name: Render intercepted activity
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: tine126
          filename: github-metrics.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_display: large
          config_timezone: Asia/Shanghai
          config_animations: yes
          extras_css: |
            :root {
              --color-calendar-graph-day-bg: #111111;
              --color-calendar-graph-day-border: #242424;
              --color-calendar-graph-day-L1-bg: #343434;
              --color-calendar-graph-day-L2-bg: #6f6f6f;
              --color-calendar-graph-day-L3-bg: #d00000;
              --color-calendar-graph-day-L4-bg: #e8e8e8;
            }
            svg { background: #050505 !important; }
            .items-wrapper { position: relative; min-height: 360px; }
            .items-wrapper::before {
              content: "?";
              position: absolute;
              right: 158px;
              top: 82px;
              width: 118px;
              height: 118px;
              border: 1px solid #d00000;
              border-radius: 50%;
              color: #e8e8e8;
              font-family: Consolas, monospace;
              font-size: 34px;
              line-height: 118px;
              text-align: center;
              box-shadow: 0 0 36px rgba(208, 0, 0, .12), inset 0 0 24px rgba(208, 0, 0, .07);
            }
            .items-wrapper::after {
              content: "TRACE DETECTED // SIGNAL ACTIVE";
              position: absolute;
              right: 73px;
              top: 232px;
              width: 290px;
              color: #d00000;
              font-size: 11px;
              letter-spacing: 4px;
              text-align: center;
            }
            h2, h3, .field { color: #e8e8e8 !important; }
            h2 { display: none !important; }
            .field svg { fill: #d00000 !important; }
            path[fill="#ebedf0"] { fill: #111111 !important; }
            path[fill="#9be9a8"] { fill: #343434 !important; }
            path[fill="#40c463"] { fill: #6f6f6f !important; }
            path[fill="#30a14e"] { fill: #d00000 !important; }
            path[fill="#216e39"] { fill: #e8e8e8 !important; }
